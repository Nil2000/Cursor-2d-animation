# VPS stack: Redis + processor + notify-server + nginx. Copy `.env` next to this file before `up`.
# Processor uses Compose DNS `redis` (see REDIS_URL below) with password auth.
# Published 6379 is for producers off this host (e.g. main-app); restrict via firewall.
# HTTP/WebSocket for notify-server is on port 80 via nginx; set NOTIFY_SERVER_URL to http(s)://<host> (no :4001).

services:
  redis:
    image: redis:7-alpine
    container_name: cursor_redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command:
      [
        "sh",
        "-c",
        'redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"',
      ]

  processor:
    image: ghcr.io/nil2000/cursor-for-2d-animations/processor-prod:latest
    container_name: cursor_processor
    restart: unless-stopped
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      # Overrides `.env`; always use in-stack Redis hostname.
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    volumes:
      # Required: processor runs `docker run manimcommunity/manim` via the host engine.
      - /var/run/docker.sock:/var/run/docker.sock

  notify-server:
    image: ghcr.io/nil2000/cursor-for-2d-animations/notify-server-prod:latest
    container_name: cursor_notify_server
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:4001:4001"

volumes:
  redis_data:
